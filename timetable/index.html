<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鳥嶼國小課表</title>
<style>
:root{
  --bg:#f6f4ef; --paper:#fff; --ink:#1f2328; --muted:#5d6670; --line:#8a8f96; --soft:#e6e2d8;
  --accent:#1f5f8b; --accent-ink:#fff; --danger:#c0392b;
  --event:#f9cfe0; --swap:#bfddf5; --sub:#fff27a; --hol:#ececec; --block:#f1efe9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:15px}
button,input,select{font:inherit}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--paper);border-bottom:1px solid var(--soft)}
header.top .home{color:var(--accent);text-decoration:none;font-size:14px}
header.top h1{font-size:18px;margin:0;font-weight:700}
header.top .term{color:var(--muted);font-size:14px}
header.top .sp{flex:1}
.demo-badge{background:#fff3cd;color:#7a5b00;border:1px solid #e8d38a;border-radius:6px;padding:2px 8px;font-size:12px}
nav.tabs{display:flex;gap:4px;padding:8px 16px 0;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--soft);border-bottom:none;background:#ebe7de;padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--ink)}
nav.tabs button.on{background:var(--paper);font-weight:700}
nav.tabs button.adm{color:var(--accent)}
main{background:var(--paper);margin:0 16px 16px;border:1px solid var(--soft);border-radius:0 8px 8px 8px;padding:12px 16px 20px;min-height:60vh}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar .grow{flex:1}
.btn{border:1px solid #c9c4b8;background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.btn:hover{background:#f3f1ec}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{color:var(--danger);border-color:#e3b3ad}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=date],input[type=number],input[type=password],input[type=month]{border:1px solid #c9c4b8;border-radius:6px;padding:6px 8px;background:#fff;color:var(--ink)}
.banner{background:#fdecea;border:1px solid #f1b8b0;color:#7d2418;padding:8px 12px;border-radius:6px;margin-bottom:10px}
.hint{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--soft);border-radius:6px}
#sheet{display:inline-block;min-width:100%;background:#fff;padding:12px;width:max-content}
#sheet h2{font-size:17px;margin:0 0 4px;text-align:center;font-weight:700}
.legend{font-size:13px;text-align:center;margin-bottom:8px;color:#333}
.sw{display:inline-block;width:14px;height:14px;border:1px solid #999;vertical-align:-2px;margin:0 3px 0 8px}
.stats{text-align:center;font-size:13px;margin:-2px 0 8px;color:#333}
table.tt{border-collapse:collapse;font-size:13px;background:#fff}
.tt th,.tt td{border:1px solid var(--line);padding:3px 4px;text-align:center;vertical-align:middle}
.tt thead th{background:#d9d9d9;font-weight:700}
.tt th.rh{background:#d9d9d9;white-space:nowrap;min-width:78px}
.tt th.rh small{font-weight:400;font-size:11px}
.tt .dstart{border-left:2.5px solid #333}
.tt-week td.c{min-width:40px}
.tt-class td.c,.tt-teacher td.c{min-width:110px;height:44px}
#sheet.fit{width:100%;display:block}
#sheet.fit table{width:100%}
.tt .s{font-weight:700}
.tt .t{font-size:12px;color:#333}
.tt td.tutor{font-weight:700}
.tt td.dt{font-size:12px}
.tt td.lunch{background:#fafafa;letter-spacing:4px}
.tt td.block{background:#fff;font-weight:700;line-height:1.5}
.tt td.hol{background:var(--hol);font-weight:700;color:#444}
.tt td.hol .holn{font-size:16px;margin:6px 0;color:#222}
.tt td.none{background:#fbfbfb}
.ty-event{background:var(--event)!important}
.ty-swap{background:var(--swap)!important}
.ty-sub{background:var(--sub)!important}
.tt td.edit{cursor:pointer}
.tt td.edit:hover{outline:2px solid #7fb3d5;outline-offset:-2px}
.tt td.sel{outline:3px solid #e67e22!important;outline-offset:-3px}
.tt td.conf{box-shadow:inset 0 0 0 2px var(--danger)}
.tt .it{line-height:1.35}
.tt .it .cl{font-size:12px;color:#333}
.tt .lost{font-size:11px;color:#777;text-decoration:line-through;margin-top:2px}
.tt .note{font-size:10px;color:#555}
/* editor */
#editor{position:fixed;right:16px;bottom:16px;width:340px;max-width:calc(100vw - 32px);max-height:75vh;overflow:auto;background:#fff;border:1px solid #c9c4b8;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:12px 14px;z-index:20}
#editor h3{margin:0 0 6px;font-size:15px}
#editor .sel-list{font-size:12px;color:#333;max-height:110px;overflow:auto;background:#f7f6f2;border-radius:6px;padding:6px 8px;margin-bottom:8px}
#editor label{display:block;font-size:13px;margin:6px 0 2px;color:var(--muted)}
#editor input[type=text],#editor textarea{width:100%;font:inherit;border:1px solid #c9c4b8;border-radius:6px;padding:6px 8px}
#editor .types{display:flex;flex-direction:column;gap:4px;font-size:13px}
#editor .types label{display:flex;align-items:center;gap:6px;color:var(--ink);margin:0}
#editor .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#editor .warn{color:var(--danger);font-size:12px;margin-top:6px}
/* check */
table.list{border-collapse:collapse;font-size:14px;width:100%}
table.list th,table.list td{border-bottom:1px solid var(--soft);padding:6px 8px;text-align:left;white-space:nowrap}
table.list th{background:#f3f1ec;position:sticky;top:0}
table.list td.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid #bbb}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--soft);border-radius:8px;padding:12px;overflow-x:auto}
.card h3{margin:0 0 8px;font-size:15px}
.holrow{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
dialog{border:1px solid #c9c4b8;border-radius:10px;padding:18px;max-width:340px;width:calc(100vw - 32px)}
dialog::backdrop{background:rgba(0,0,0,.3)}
.err{color:var(--danger);font-size:13px;min-height:18px}
@media (max-width:600px){
  main{margin:0 8px 8px;padding:10px}
  nav.tabs{padding:8px 8px 0}
  header.top{padding:10px 12px}
  #sheet{padding:8px}
  #sheet h2{font-size:15px}
  #sheet.fit .tt{font-size:12px}
  #sheet.fit th.rh{min-width:44px}
  #sheet.fit .tt th,#sheet.fit .tt td{padding:2px 2px}
  #sheet.fit .tt td.dt{font-size:11px}
  #sheet.fit .tt th.rh small{font-size:9px}
  .tt-class td.c,.tt-teacher td.c{min-width:0;height:40px}
  .tt .t,.tt .it .cl{font-size:11px}
}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff}
  header.top,nav.tabs,.bar,#editor,.noprint,.banner{display:none!important}
  main{border:none;margin:0;padding:0}
  .scroll{border:none;overflow:visible}
  #sheet{padding:0}
  .tt td.sel{outline:none!important}
  .tt td.conf{box-shadow:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* 個人課表：調課 */
.tt .moved{font-size:11px;color:#6b7280;margin-top:2px}
.summary{border:1px solid var(--soft);background:#fbfaf6;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.summary ul{margin:6px 0 0;padding:0;list-style:none}
.summary li{padding:3px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.summary .when{color:var(--muted);min-width:120px}
.summary.ok{color:var(--muted)}
/* 電腦版：縮放與固定表頭 */
.scroll.fitmode{overflow:visible;border:none}
.scroll.fitmode #sheet{padding:4px 0}
.scroll.capped{max-height:calc(100vh - 150px);overflow:auto}
.tt thead{position:sticky;top:0;z-index:3}
.scroll.capped .tt tbody th.rh{position:sticky;left:0;z-index:2}
.fitchk{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
#mag{position:fixed;pointer-events:none;background:#fff;border:1px solid #999;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.2);padding:6px 12px;font-size:16px;z-index:50;text-align:center;line-height:1.4}
#mag .t{font-size:14px;color:#333}
/* 手機：星期按鈕與清單 */
.daytabs{display:flex;gap:6px;margin-bottom:10px}
.daytabs button{flex:1;min-width:0;border:1px solid #c9c4b8;background:#fff;border-radius:8px;padding:6px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer;color:var(--ink);font-size:15px}
.daytabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.daytabs small{font-size:11px;opacity:.85}
.agenda{border:1px solid var(--soft);border-radius:8px;overflow:hidden;background:#fff}
.ag-row{display:flex;border-top:1px solid var(--soft);min-height:50px}
.ag-row:first-child{border-top:none}
.ag-t{width:76px;flex:none;padding:6px 8px;background:rgba(0,0,0,.035);display:flex;flex-direction:column;justify-content:center}
.ag-t b{font-size:14px}
.ag-t small{color:var(--muted);font-size:11px}
.ag-c{flex:1;min-width:0;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;font-size:15px;gap:2px}
.ag-row.light{min-height:36px}
.ag-row.light .ag-c{color:var(--muted);font-size:13px}
.ag-row.hol .ag-c{background:var(--hol)}
.ag-row.blockrow .ag-c{font-weight:700}
.ag-c .s{font-weight:700}
.ag-c .t{color:#333}
.ag-c .note{font-size:12px;color:#555}
.ag-c .lost{font-size:12px;color:#777;text-decoration:line-through}
.ag-c .moved{font-size:13px;color:#6b7280}
.ag-c .it .cl{font-size:13px;color:#444}
.muted{color:#aaa}
.m-stats{text-align:left;margin:0 0 8px;font-size:13px}
.scroll.m-day{border:none}
.scroll.m-day .tt{width:100%;font-size:12px}
.scroll.m-day .tt th.rh{min-width:48px}
.scroll.m-day .tt td.c{min-width:0}
@media print{
  #sheet{zoom:1 !important}
  .tt thead{position:static}
  .tt-week{font-size:9px}
  .tt-week td.c{min-width:0}
  #mag{display:none}
}
@media (max-width:700px){
  .bar{gap:6px}
  .bar .btn,.bar select{padding:5px 9px;font-size:14px}
  .bar .hide-m{display:none}
  .ag-t{width:86px}
  .ag-t b{font-size:13px;white-space:nowrap}
  .summary{font-size:13px}
  .summary .when{min-width:0}
  header.top h1{font-size:17px}
}
</style>
</head>

  const set = new Set();
  S.bases.forEach(b => { b.tutor.forEach(t => set.add(t)); Object.values(b.cells).forEach(v => v.t && set.add(v.t)); });
  Object.values(S.days).forEach(day => { Object.values(day.cells||{}).forEach(v => v.t && set.add(v.t)); Object.values(day.tut||{}).forEach(v => v.t && set.add(v.t)); });
  return [...set];
}
function conflicts(dates, models){
  const out = new Set();
  dates.forEach((date,d) => {
    const M = models[d];
    for (let p=1;p<=7;p++){
      const m = {};
      for (let c=0;c<6;c++){ if (M.grid[RI[p]][c]?.kind!=="cell") continue; const x = cellAt(date,d,c,p); if (x?.t) (m[x.t] ||= []).push(`${date}|${c}|${p}`); }
      Object.values(m).forEach(a => a.length>1 && a.forEach(k => out.add(k)));
    }
  });
  return out;
}

const LS_KEY = "tt-demo-v2";
function deepMerge(t, patch){
  for (const [k,v] of Object.entries(patch)){
    if (v===DEL) delete t[k];
    else if (v && typeof v==="object" && !Array.isArray(v)) { t[k] = (t[k] && typeof t[k]==="object" && !Array.isArray(t[k])) ? t[k] : {}; deepMerge(t[k], v); }
    else t[k] = v;
  }
  return t;
}
function saveDemo(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({settings:S.settings, bases:S.bases, days:S.days})); }catch(e){} }
function toFire(patch){
  const o = {};
  for (const [k,v] of Object.entries(patch)) o[k] = v===DEL ? fb.deleteField() : (v && typeof v==="object" && !Array.isArray(v)) ? toFire(v) : v;
  return o;
}
async function writeDay(date, patch){

/* ---------- table pieces ---------- */
function rowHead(r){
  if (r==="am") return `<th class="rh">晨間<br><small>08:10~08:30</small></th>`;
  if (r==="brk") return `<th class="rh">大下課<br><small>10:10~10:30</small></th>`;
  if (r==="lunch") return `<th class="rh">午餐<br><small>12:00~13:20</small></th>`;
  return `<th class="rh">${PNUM[r]}<br><small>${PER[r]}</small></th>`;
}
function dayLabel(dates,d){ return dates ? `${mmdd(dates[d])}(${DAYN[d]})` : `(${DAYN[d]})`; }
const editable = () => S.admin && !S.exporting && S.view!=="orig";
const isSel = (kind,key) => !S.exporting && S.other?.kind===kind && S.other.key===key;
function tutorTd(date,c,dstart){
  const x = tutorAt(date,c); const key = `${date}|${c}`;
  const can = editable() && date;
  return `<td class="tutor ${dstart?"dstart":""} ${x.changed?TYPES[x.type]?.cls||"":""} ${can?"edit":""} ${isSel("tut",key)?"sel":""}" ${can?`data-tut="${key}"`:""}>${esc(x.t)}</td>`;
}
function cellTd(date,d,c,p,dstart,conf){
  const x = cellAt(date,d,c,p);
  const key = date ? `${date}|${c}|${p}` : `B|${d}|${c}|${p}`;
  const cls = ["c"];
  if (dstart) cls.push("dstart");
  if (x?.changed && TYPES[x.type]?.cls) cls.push(TYPES[x.type].cls);
  if (!x || (!x.s && !x.t)) cls.push("none");
  if (editable()) cls.push("edit");
  if (!S.exporting && S.sel.includes(key)) cls.push("sel");
  if (!S.exporting && conf.has(key)) cls.push("conf");
  let title = "";
  if (x?.changed) title = `${TYPES[x.type]?.name||""}｜原：${x.os||"（無）"} ${x.ot||""}${x.note?`｜${x.note}`:""}`;
  const inner = x && (x.s||x.t) ? `<div class="s">${esc(x.s)}</div><div class="t">${esc(x.t)}</div>` : "";
  return `<td class="${cls.join(" ")}" ${editable()?`data-key="${key}"`:""} ${title?`title="${esc(title)}"`:""}>${inner}</td>`;
}
function itemTd(it, date, d, span, rowspan, dstart){
  const sp = `${span>1?` colspan="${span}"`:""}${rowspan>1?` rowspan="${rowspan}"`:""}`;
  const ds = dstart ? "dstart" : "";
  if (it.kind==="hol") return `<td${sp} class="${ds} hol"><div>國定假日</div><div class="holn">${esc(it.text)}</div><div>停課</div></td>`;
  if (it.kind==="lunch") return `<td${sp} class="${ds} lunch">午餐、午休</td>`;
  if (it.kind==="text"){
    const key = date ? `${date}|${it.field}` : `B|${d}|${it.field}`;
    const can = editable();
    return `<td${sp} class="dt ${ds} ${it.changed?"ty-event":""} ${can?"edit":""} ${isSel("text",key)?"sel":""}" ${can?`data-dt="${key}"`:""}>${esc(it.text)}</td>`;
  }
  // block
  const key = `${date}|${it.idx}`; const can = editable() && date;
  return `<td${sp} class="${ds} block ${TYPES[it.type]?.cls||""} ${can?"edit":""} ${isSel("blk",key)?"sel":""}" ${can?`data-blk="${key}"`:""}>${escBr(it.text)}</td>`;
}

/* ---------- 版面模式 ---------- */
const mq = window.matchMedia("(max-width: 700px)");
const isMobile = () => !S.exporting && !S.printing && mq.matches;

/* ---------- 週課表 / 班級課表（共用表格） ---------- */
function gridTable(dates, cols, days = [0,1,2,3,4]){
  const week = cols.length===6;
  const models = [0,1,2,3,4].map(d => dayModel(dates?dates[d]:null, d));
  const conf = dates ? conflicts(dates, models) : new Set();
  let h = `<table class="tt ${week?"tt-week":"tt-class"}"><thead><tr><th class="rh">${week?"星期":"節次"}</th>`;
  for (const d of days) h += `<th colspan="${cols.length}" class="dstart">${dayLabel(dates,d)}</th>`;
  h += `</tr>`;
  if (week){ h += `<tr><th class="rh">年級／節次</th>`; for (const d of days) CN.forEach((n,c) => h += `<th class="${c===0?"dstart":""}">${n}<br>年級</th>`); h += `</tr>`; }
  h += `</thead><tbody>`;
  if (week){ h += `<tr><th class="rh">導師</th>`; for (const d of days) for (let c=0;c<6;c++) h += tutorTd(dates?dates[d]:null, c, c===0); h += `</tr>`; }
  for (let ri=0; ri<10; ri++){
    h += `<tr>${rowHead(ROWS[ri])}`;
    let skip = 0;
    for (let di=0; di<days.length; di++){
      if (skip>0){ skip--; continue; }
      const d = days[di]; const M = models[d]; const date = dates ? dates[d] : null;
      let j = 0;
      while (j < cols.length){
        const it = M.grid[ri][cols[j]];
        let k = j; while (k+1<cols.length && M.grid[ri][cols[k+1]]===it) k++;
        if (it.r0===ri){
          let span = k-j+1;
          if (it.kind==="cell") h += cellTd(date,d,it.c,it.p,j===0,conf);
          else {
            if (it.kind==="lunch" && span===cols.length){   // 連續幾天的午餐合併成一格
              let e = di;
              while (e+1<days.length && days[e+1]===days[e]+1){ const n = models[days[e+1]].grid[6]; if (cols.every(c => n[c]?.kind==="lunch" && n[c]===n[cols[0]])) e++; else break; }
              span *= (e-di+1); skip = e-di;
            }
            h += itemTd(it, date, d, span, it.r1-it.r0+1, j===0);
          }
        }
        j = k+1;
      }
    }
    h += `</tr>`;
  }
  return h + `</tbody></table>`;
}

/* ---------- 個人課表：整週資料與調課配對 ---------- */
function teacherWeek(dates, who){
  const models = [0,1,2,3,4].map(d => dayModel(dates?dates[d]:null, d));
  const at = {};            // `${d}|${ri}` → 這格的項目
  const gained = [], lost = [];
  const add = (d,ri,e) => (at[`${d}|${ri}`] ||= []).push(e);
  for (let d=0; d<5; d++){
    const M = models[d]; const date = dates ? dates[d] : null;
    for (const p of [1,2,3,4,5,6,7]){
      const ri = RI[p];
      for (let c=0;c<6;c++){
        const it = M.grid[ri][c];
        if (it.kind==="cell"){
          const x = cellAt(date,d,c,p); if (!x) continue;
          if (x.t===who){
            const e = {kind:"have", d, p, c, x};
            if (x.changed && x.ot!==who){ e.kind = "in"; gained.push(e); }
            add(d,ri,e);
          } else if (x.changed && x.ot===who){
            const e = {kind:"out", d, p, c, x}; lost.push(e); add(d,ri,e);
          }
        } else if (it.kind==="block"){
          const b = baseCell(date,d,c,p);
          if (b?.t===who) add(d,ri,{kind:"blk", d, p, c, x:b, text:(it.text||"停課").replace(/\n/g," ")});
        }
      }
    }
  }
  // 調課配對：同一週、同一班，一節調出 ↔ 一節調進
  const gs = gained.filter(e => e.x.type==="swap"), ls = lost.filter(e => e.x.type==="swap");
  ls.forEach(l => { const g = gs.find(g => !g.pair && g.c===l.c) || gs.find(g => !g.pair); if (g){ g.pair = l; l.pair = g; } });
  const all = Object.values(at).flat();
  const st = {
    total: all.filter(e => e.kind==="have" || e.kind==="in").length,
    swap: gained.filter(e => e.x.type==="swap").length,
    sub: gained.filter(e => e.x.type!=="swap").length,
    out: lost.filter(e => e.x.type!=="swap").length
  };
  return {models, at, gained, lost, st};
}
const slotName = (dates,e) => `${dates ? md(dates[e.d]) : `週${DAYN[e.d]}`} 第${PNUM[e.p]}節`;
function entryHTML(e, dates){
  const cl = `<span class="cl">${CN[e.c]}年級</span>`;
  if (e.kind==="have") return `<div class="it">${cl} <span class="s">${esc(e.x.s)}</span></div>`;
  if (e.kind==="in"){
    const note = e.x.type==="swap" ? `↩ ${e.pair ? `由 ${slotName(dates,e.pair)} 調來` : "本節為調課"}` : (e.x.ot ? `代 ${esc(e.x.ot)}` : "");
    return `<div class="it">${cl} <span class="s">${esc(e.x.s)}</span>${note?`<div class="note">${note}</div>`:""}</div>`;
  }
  if (e.kind==="out"){
    if (e.x.type==="swap") return `<div class="moved">↪ ${CN[e.c]}年級 ${esc(e.x.os)} ${e.pair ? `調至 ${slotName(dates,e.pair)}` : "本節調課"}</div>`;
    return `<div class="lost">${CN[e.c]}年級 ${esc(e.x.os)} → ${esc(e.x.t||"（無）")}</div>`;
  }
  return `<div class="lost">${CN[e.c]}年級 ${esc(e.x.s)} → ${esc(e.text)}</div>`;
}
function entriesCls(list){
  const e = list.find(e => e.kind==="in") || list.find(e => e.kind==="out" && e.x.type!=="swap");
  return e ? (TYPES[e.x.type]?.cls || "") : "";
}
function statsLine(st, orig){
  if (orig) return `每週 ${st.total} 節`;
  const parts = [st.swap?`調課 ${st.swap} 節`:"", st.sub?`代課 ${st.sub} 節`:""].filter(Boolean);
  return `本週授課 ${st.total} 節${parts.length?`（${parts.join("、")}）`:""}${st.out?`，原課由他人代 ${st.out} 節`:""}`;
}
function teacherTable(dates, who){
  const W = teacherWeek(dates, who);
  let h = `<table class="tt tt-teacher"><thead><tr><th class="rh">節次</th>`;
  for (let d=0;d<5;d++) h += `<th class="dstart">${dayLabel(dates,d)}</th>`;
  h += `</tr></thead><tbody>`;
  const full = it => it && it.c0===0 && it.c1===5 && it.kind!=="cell";
  for (let ri=0; ri<10; ri++){
    h += `<tr>${rowHead(ROWS[ri])}`;
    let skip = 0;
    for (let d=0; d<5; d++){
      if (skip>0){ skip--; continue; }
      const row = W.models[d].grid[ri];
      if (full(row[0]) && row.every(x => x===row[0])){
        const it = row[0];
        if (it.r0!==ri) continue;
        let span = 1;
        if (it.kind==="lunch"){ let e = d; while (e+1<5 && W.models[e+1].grid[6].every(x => x===W.models[e+1].grid[6][0] && x.kind==="lunch")) e++; span = e-d+1; skip = e-d; }
        h += itemTd(it, null, d, span, it.r1-it.r0+1, true).replace(/ data-(dt|blk)="[^"]*"/,"").replace(" edit","");
        continue;
      }
      if (ri===0 || ri===3 || ri===6){
        const texts = [...new Set(row.filter(x => x.kind==="text").map(x => x.text))];
        h += `<td class="dt dstart">${esc(texts.join("／"))}</td>`; continue;
      }
      const list = W.at[`${d}|${ri}`] || [];
      h += `<td class="c dstart ${entriesCls(list)} ${list.length?"":"none"}">${list.map(e => entryHTML(e,dates)).join("")}</td>`;
    }
    h += `</tr>`;
  }
  return {html: h + `</tbody></table>`, st: W.st};
}
function changeSummary(dates, who){
  if (!dates) return "";
  const W = teacherWeek(dates, who);
  const list = [...W.gained, ...W.lost].sort((a,b) => a.d-b.d || a.p-b.p);
  if (!list.length) return `<div class="summary noprint ok">${esc(who)}老師本週沒有調代課異動。</div>`;
  const li = e => {
    const when = `${md(dates[e.d])}(${DAYN[e.d]}) 第${PNUM[e.p]}節`;
    const tag = `<span class="chip" style="background:${TYPES[e.x.type]?.color||"#fff"}">${e.x.type==="swap"?"調課":e.x.type==="sub"?"代課":e.x.type==="event"?"行事":"異動"}</span>`;
    let txt;
    if (e.kind==="in") txt = e.x.type==="swap" ? `${CN[e.c]}年級 ${esc(e.x.s)}${e.pair?`（由 ${slotName(dates,e.pair)} 調來）`:""}` : `代 ${esc(e.x.ot||"")} 上 ${CN[e.c]}年級 ${esc(e.x.s)}`;
    else txt = e.x.type==="swap" ? `${CN[e.c]}年級 ${esc(e.x.os)} ${e.pair?`調至 ${slotName(dates,e.pair)}`:"調課"}` : `${CN[e.c]}年級 ${esc(e.x.os)} 由 ${esc(e.x.t||"（無）")} 代`;
    return `<li><span class="when">${when}</span>${tag}${txt}</li>`;
  };
  return `<div class="summary noprint"><b>${esc(who)}老師本週有 ${list.length} 節異動</b><ul>${list.map(li).join("")}</ul></div>`;
}

/* ---------- 手機清單版 ---------- */
const ROWLABEL = r => r==="am" ? ["晨間","08:10"] : r==="brk" ? ["大下課","10:10"] : r==="lunch" ? ["午餐","12:00"] : [`第${PNUM[r]}節`, PER[r].slice(0,5)];
function rangeLabel(it){
  const a = ROWS[it.r0], b = ROWS[it.r1];
  if (it.r0===it.r1) return ROWLABEL(a);
  const ps = ROWS.slice(it.r0, it.r1+1).filter(x => typeof x==="number");
  return [ps.length>1 ? `第${PNUM[ps[0]]}～${PNUM[ps[ps.length-1]]}節` : ROWLABEL(a)[0], ROWLABEL(a)[1]];
}
function agRow(label, body, cls){ return `<div class="ag-row ${cls||""}"><div class="ag-t"><b>${label[0]}</b><small>${label[1]}</small></div><div class="ag-c">${body}</div></div>`; }
function agenda(dates, d, mode){   // mode: {cls} 或 {who}
  const date = dates ? dates[d] : null;
  const M = dayModel(date, d);
  let h = `<div class="agenda">`;
  if (M.items[0]?.kind==="hol") return h + agRow(["全天",""], `<b>國定假日：${esc(M.items[0].text)}</b>　停課`, "hol") + `</div>`;
  const W = mode.who!=null ? teacherWeek(dates, mode.who) : null;
  for (let ri=0; ri<10; ri++){
    const r = ROWS[ri];
    if (mode.cls!=null){
      const it = M.grid[ri][mode.cls];
      if (it.r0!==ri) continue;
      if (it.kind==="cell"){
        const x = cellAt(date,d,mode.cls,r);
        const body = x && (x.s||x.t) ? `<span class="s">${esc(x.s)}</span> <span class="t">${esc(x.t)}</span>${x.changed&&x.type!=="plain"?`<span class="note">（原：${esc(x.os||"無")} ${esc(x.ot||"")}）</span>`:""}` : `<span class="muted">—</span>`;
        h += agRow(ROWLABEL(r), body, x?.changed ? TYPES[x.type]?.cls : "");
      } else if (it.kind==="lunch") h += agRow(ROWLABEL(r), "午餐、午休", "light");
      else h += agRow(rangeLabel(it), escBr(it.text)||"<span class='muted'>—</span>", (it.kind==="text"?"light ":"") + (it.kind==="block"?(TYPES[it.type]?.cls||"blockrow"):"") + (it.changed?" ty-event":""));
      continue;
    }
    // 個人
    const row = M.grid[ri];
    if (row.every(x => x===row[0]) && row[0].kind!=="cell"){
      const it = row[0]; if (it.r0!==ri) continue;
      h += agRow(it.kind==="lunch" ? ROWLABEL(r) : rangeLabel(it), it.kind==="lunch" ? "午餐、午休" : escBr(it.text), it.kind==="block" ? (TYPES[it.type]?.cls||"blockrow") : "light");
      continue;
    }
    if (ri===0 || ri===3 || ri===6){ const texts = [...new Set(row.filter(x => x.kind==="text").map(x => x.text))]; h += agRow(ROWLABEL(r), esc(texts.join("／")), "light"); continue; }
    const list = W.at[`${d}|${ri}`] || [];
    h += agRow(ROWLABEL(r), list.length ? list.map(e => entryHTML(e,dates)).join("") : `<span class="muted">空堂</span>`, entriesCls(list));
  }
  return h + `</div>`;
}
function dayTabs(dates){
  return `<div class="daytabs noprint">${[0,1,2,3,4].map(d => {
    const hol = dates && holidayName(dates[d]);
    return `<button class="${d===dayIdx()?"on":""}" data-day="${d}"><b>${DAYN[d]}</b><small>${dates?md(dates[d]):""}${hol?" 放假":""}</small></button>`;
  }).join("")}</div>`;
}

/* ---------- 標題與整張表 ---------- */
function legend(){
  return `<div class="legend"><span class="sw" style="background:var(--event)"></span>粉紅色為學校行事、<span class="sw" style="background:var(--swap)"></span>藍色為教師協調代調課、<span class="sw" style="background:var(--sub)"></span>黃色為公假排代或自費代課</div>`;

function monthsInTerm(){
  const out = []; const s = termStart(); const e = addDays(s, S.settings.weeks*7-1);
  const d = pdate(s); d.setDate(1);
  while (ymd(d) <= e){ out.push(ymd(d).slice(0,7)); d.setMonth(d.getMonth()+1); }
  return out;
}
function checkRows(){
  const rows = [];
  Object.entries(S.days).forEach(([date,day]) => {
    if (!date.startsWith(S.month)) return;
    const M = dayModel(date, weekdayOf(date));
    Object.entries(day.cells||{}).forEach(([k,ch]) => {
      if (!S.ctypes.has(ch.type)) return;
      const m = k.match(/^c(\d)p(\d)$/); if (!m) return;
      const c = +m[1], p = +m[2];
      if (M.grid[RI[p]][c]?.kind!=="cell") return;   // 被活動格蓋住的不算
      rows.push({date, c, p, ...ch, hol:holidayName(date)});
    });
  });
  rows.sort((a,b) => a.date.localeCompare(b.date) || a.p-b.p || a.c-b.c);
  return rows;
}

  if (a[0]==="B") return {base:true, d:+a[1], c:+a[2], p:+a[3]};
  return {date:a[0], d:weekdayOf(a[0]), c:+a[1], p:+a[2]};
}
function keyLabel(k){

  const when = x.base ? `(${DAYN[x.d]})` : `${md(x.date)}(${DAYN[x.d]})`;
  return `${when} ${CN[x.c]}年級 第${PNUM[x.p]}節　${esc(cur?.s||"（空）")} ${esc(cur?.t||"")}`;
}

function clearSel(){ S.sel = []; S.other = null; }
async function applyEdit(){
  const keys = S.sel; const multi = keys.length>1;
  const s = $("#edS").value.trim(), t = $("#edT").value.trim(), clearT = $("#edClearT").checked;
  if (parseKey(keys[0]).base){
    const nb = structuredClone(S.bases); const B = nb[Math.min(S.baseIdx, nb.length-1)];
    keys.forEach(k => { const x = parseKey(k); const id = `${x.d}-${x.c}-${x.p}`; const cur = B.cells[id]||{s:"",t:""};
      const v = {s: (s||!multi) ? s : cur.s, t: clearT ? "" : (t||!multi) ? t : cur.t};
      if (!v.s && !v.t) delete B.cells[id]; else B.cells[id] = v; });
    clearSel(); await writeBases(nb); render(); return;
  }
  const type = selType() || "plain"; const note = $("#edN").value.trim();
  const patches = {};
  keys.forEach(k => {
    const x = parseKey(k); const cur = cellAt(x.date,x.d,x.c,x.p); const b = baseCell(x.date,x.d,x.c,x.p);
    ((patches[x.date] ||= {cells:{}}).cells)[`c${x.c}p${x.p}`] = { type,
      s: (s||!multi) ? s : (cur?.s||""), t: clearT ? "" : (t||!multi) ? t : (cur?.t||""),
      note: note || (multi ? (cur?.note||"") : ""), os: b?.s||"", ot: b?.t||"" };
  });
  clearSel();
  await Promise.all(Object.entries(patches).map(([d,p]) => writeDay(d,p)));
  render();
}
async function swapEdit(){
  const [ka,kb] = S.sel; const a = parseKey(ka), b = parseKey(kb);
  const ca = cellAt(a.date,a.d,a.c,a.p)||{s:"",t:""}, cb = cellAt(b.date,b.d,b.c,b.p)||{s:"",t:""};
  const ba = baseCell(a.date,a.d,a.c,a.p), bb = baseCell(b.date,b.d,b.c,b.p);
  const note = ($("#edN")?.value||"").trim();
  const recA = {type:"swap", s:cb.s||"", t:cb.t||"", note, os:ba?.s||"", ot:ba?.t||""};
  const recB = {type:"swap", s:ca.s||"", t:ca.t||"", note, os:bb?.s||"", ot:bb?.t||""};
  clearSel();
  if (a.date===b.date) await writeDay(a.date, {cells:{[`c${a.c}p${a.p}`]:recA, [`c${b.c}p${b.p}`]:recB}});
  else { await writeDay(a.date,{cells:{[`c${a.c}p${a.p}`]:recA}}); await writeDay(b.date,{cells:{[`c${b.c}p${b.p}`]:recB}}); }
  render();
}
async function resetEdit(){
  const patches = {};
  S.sel.forEach(k => { const x = parseKey(k); ((patches[x.date] ||= {cells:{}}).cells)[`c${x.c}p${x.p}`] = DEL; });
  clearSel();
  await Promise.all(Object.entries(patches).map(([d,p]) => writeDay(d,p)));
  render();
}
async function applyText(reset){
  const a = S.other.key.split("|"); const v = reset ? DEL : $("#edText").value.trim();
  clearSel();
  if (a[0]==="B"){ const nb = structuredClone(S.bases); nb[Math.min(S.baseIdx,nb.length-1)][a[2]][+a[1]] = v; await writeBases(nb); }
  else await writeDay(a[0], {[a[1]]: v});
  render();
}
async function applyTut(reset){
  const [date,c] = S.other.key.split("|");
  const v = reset ? DEL : {t:$("#edT").value.trim(), type:selType()||"plain"};
  clearSel(); await writeDay(date, {tut:{[`c${c}`]: v}}); render();
}
async function editBlocks(date, fn){
  const list = structuredClone(dayBlocks(date, weekdayOf(date)).list).map(b => { const {d, ...rest} = b; return rest; });
  fn(list); clearSel(); await writeDay(date, {blocks:list}); render();
}
async function mkBlock(){
  const ks = S.sel.map(parseKey); const date = ks[0].date;
  const rows = ks.map(k => RI[k.p]), cols = ks.map(k => k.c);
  const b = {c0:Math.min(...cols), c1:Math.max(...cols), r0:Math.min(...rows), r1:Math.max(...rows), text:$("#edBlkText").value.trim(), type: selType()==="plain" ? "" : selType()};
  if (b.r0<6 && b.r1>6) { alert("活動格不能跨過午餐時間，請上午、下午分開合併。"); return; }
  await editBlocks(date, list => list.push(b));
}

/* ---------- export ---------- */
function fileBase(){
  const w = `W${S.week}`;
  if (S.view==="orig"){ const n = baseFor(null).name; return S.origMode==="class" ? `${termShort()}_${n}_${CN[S.cls]}年級` : S.origMode==="teacher" ? `${termShort()}_${n}_${S.who}` : `${termShort()}_${n}_全校`; }
  if (S.view==="week") return S.editBase ? `${termShort()}_${baseFor(null).name}` : `${termShort()}_${w}_週課表`;
  if (S.view==="class") return `${termShort()}_${w}_${CN[S.cls]}年級課表`;
  return `${termShort()}_${w}_${S.who}課表`;
}
function download(blob, name){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportSheetHTML(){ S.exporting = true; try { return sheetHTML(); } finally { S.exporting = false; } }
function offscreen(cls){
  const holder = document.createElement("div");
  holder.style.cssText = "position:fixed;left:-10000px;top:0;background:#fff";
  holder.innerHTML = `<div id="sheet" class="${cls}" style="display:inline-block;padding:16px;${cls?"width:1400px;":""}">${exportSheetHTML()}</div>`;
  document.body.appendChild(holder); return holder;
}
async function exportPNG(){
  const holder = offscreen("");
  try{
    const el = holder.firstElementChild;
    const canvas = await html2canvas(el, {scale:2, backgroundColor:"#ffffff", windowWidth: el.scrollWidth+40});
    canvas.toBlob(b => download(b, fileBase()+".png"));
  } finally { holder.remove(); }
}
function loadScript(src){
  return new Promise((res,rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("無法載入 Word 產生器，請確認網路")); document.head.appendChild(s); });
}
function rgbHex(c){
  const m = c && c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/);
  if (!m || (m[4]!==undefined && +m[4]===0)) return null;
  const h = [m[1],m[2],m[3]].map(x => (+x).toString(16).padStart(2,"0")).join("").toUpperCase();
  return h==="FFFFFF" ? null : h;
}
async function exportDocx(){
  if (!window.docx) await loadScript("https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js");
  const D = window.docx;
  const week = S.view==="week" || (S.view==="orig" && S.origMode==="week");
  const k = week ? 0.82 : 0.9;
  const hp = px => Math.max(10, Math.round(parseFloat(px)*0.75*k*2));
  const holder = offscreen(week ? "" : "fit");
  try{
    const sheet = holder.firstElementChild;
    const runsOf = (node, st) => {
      const out = [];
      node.childNodes.forEach(n => {
        if (n.nodeType===3){ const tx = n.textContent.replace(/\s+/g," "); if (tx.trim()) out.push(new D.TextRun({text:tx, bold:st.bold, size:st.size, strike:st.strike, color:st.color})); }
        else if (n.tagName==="BR") out.push(new D.TextRun({text:"", break:1}));
        else if (n.nodeType===1){ const cs = getComputedStyle(n); out.push(...runsOf(n, {bold:+cs.fontWeight>=600, size:hp(cs.fontSize), strike:cs.textDecorationLine.includes("line-through"), color:rgbHex(cs.color)||undefined})); }
      });
      return out;
    };
    const paras = el => {
      const cs = getComputedStyle(el);
      const divs = [...el.children].filter(c => c.tagName==="DIV");
      const blocks = divs.length ? divs : [el];
      return blocks.map(b => { const bcs = b===el ? cs : getComputedStyle(b);
        return new D.Paragraph({alignment:D.AlignmentType.CENTER, spacing:{before:0,after:0,line:240},
          children: runsOf(b, {bold:+bcs.fontWeight>=600, size:hp(bcs.fontSize), strike:bcs.textDecorationLine.includes("line-through")})}); });
    };
    const table = sheet.querySelector("table");
    const nCols = week ? 31 : 6;
    const usable = 16838 - 2*567;
    const first = week ? 1080 : 1250;
    const colW = Array(nCols).fill(Math.floor((usable-first)/(nCols-1))); colW[0] = first;
    const thin = {style:D.BorderStyle.SINGLE, size:4, color:"777777"};
    const thick = {style:D.BorderStyle.SINGLE, size:16, color:"333333"};
    const rows = [...table.rows].map((tr,ri) => new D.TableRow({cantSplit:true, height: (!week && ri>0) ? {value:640, rule:D.HeightRule.ATLEAST} : undefined, children:[...tr.cells].map(td => {
      const cs = getComputedStyle(td); const bg = rgbHex(cs.backgroundColor);
      return new D.TableCell({
        children: paras(td), columnSpan: td.colSpan, rowSpan: td.rowSpan,
        verticalAlign: D.VerticalAlign.CENTER, margins: {top:15, bottom:15, left:20, right:20},
        shading: bg ? {type:D.ShadingType.CLEAR, color:"auto", fill:bg} : undefined,
        borders: {top:thin, bottom:thin, right:thin, left: parseFloat(cs.borderLeftWidth)>2 ? thick : thin}
      });
    })}));
    const title = sheet.querySelector("h2").textContent;
    const legendRun = (fill, text) => [new D.TextRun({text:"　", shading:{type:D.ShadingType.CLEAR, color:"auto", fill}, size:18}), new D.TextRun({text, size:18})];
    const children = [
      new D.Paragraph({alignment:D.AlignmentType.CENTER, spacing:{after:40}, children:[new D.TextRun({text:title, bold:true, size:week?26:28})]}),
      new D.Paragraph({alignment:D.AlignmentType.CENTER, spacing:{after:60}, children:[...legendRun("F9CFE0"," 粉紅色為學校行事　"), ...legendRun("BFDDF5"," 藍色為教師協調代調課　"), ...legendRun("FFFF00"," 黃色為公假排代或自費代課")]})
    ];
    const stats = sheet.querySelector(".stats");
    if (stats) children.push(new D.Paragraph({alignment:D.AlignmentType.CENTER, spacing:{after:60}, children:[new D.TextRun({text:stats.textContent, size:18})]}));
    children.push(new D.Table({rows, columnWidths:colW, width:{size:usable, type:D.WidthType.DXA}, layout:D.TableLayoutType.FIXED}));
    const font = {ascii:"Microsoft JhengHei", eastAsia:"Microsoft JhengHei", hAnsi:"Microsoft JhengHei", cs:"Microsoft JhengHei"};
    const doc = new D.Document({ styles:{default:{document:{run:{font}}}},
      sections:[{properties:{page:{size:{width:11906, height:16838, orientation:D.PageOrientation.LANDSCAPE}, margin:{top:567,bottom:567,left:567,right:567}}}, children}] });
    download(await D.Packer.toBlob(doc), fileBase()+".docx");
  } finally { holder.remove(); }
}
function exportCSV(){
  const rows = checkRows();
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  let csv = "週次,日期,星期,節次,班級,類別,原科目,原老師,異動後科目,異動後老師,備註,是否國定假日\n";
  rows.forEach(r => csv += [`W${weekOf(r.date)}`, r.date, DAYN[weekdayOf(r.date)], PNUM[r.p], CN[r.c]+"年級", TYPES[r.type]?.name, r.os, r.ot, r.s, r.t, r.note, r.hol?`是（${r.hol}）`:""].map(q).join(",") + "\n");
  download(new Blob(["﻿"+csv], {type:"text/csv"}), `${termShort()}_${S.month}_代調課明細.csv`);
}
function exportBackup(){
  download(new Blob([JSON.stringify({settings:S.settings, bases:S.bases, days:S.days}, null, 1)], {type:"application/json"}), `課表備份_${ymd(new Date())}.json`);
}

/* ---------- render & routing ---------- */
function writeHash(){
  const p = new URLSearchParams({v:S.view, w:S.week});
  if (S.view==="orig"){ p.delete("w"); p.set("m", S.origMode); if (S.origIdx>=0) p.set("b", S.origIdx); }
  if (S.view==="class" || (S.view==="orig" && S.origMode==="class")) p.set("c", S.cls);
  if (S.view==="teacher" || (S.view==="orig" && S.origMode==="teacher")) p.set("t", S.who);
  history.replaceState(null, "", location.pathname + location.search + "#" + p.toString());
}
function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("v")) S.view = p.get("v");
  if (p.get("w")) S.week = +p.get("w") || S.week;
  if (p.get("c")) S.cls = +p.get("c") || 0;
  if (p.get("t")) S.who = p.get("t");
  if (p.get("m")) S.origMode = p.get("m");
  if (p.get("b")) S.origIdx = +p.get("b");
}
function render(){
  if (!["week","class","teacher","orig","check","settings"].includes(S.view)) S.view = "week";
  if (!S.admin && ["check","settings"].includes(S.view)) S.view = "week";
  if (!S.admin) { clearSel(); S.editBase = false; }
  S.week = Math.min(Math.max(S.week,1), S.settings.weeks);
  const ts = allTeachers(); if (!ts.includes(S.who)) S.who = ts[0];
  $("#termLbl").textContent = S.settings.termName;
  $("#loginBtn").textContent = S.admin ? "登出後台" : "後台登入";
  const tabs = [["week","全校週課表"],["class","班級課表"],["teacher","個人課表"],["orig","原課表"]];
  if (S.admin) tabs.push(["check","核對節次"],["settings","設定"]);
  $("#tabs").innerHTML = tabs.map(([k,n]) => `<button class="${k===S.view?"on":""} ${["check","settings"].includes(k)?"adm":""}" data-tab="${k}">${n}</button>`).join("");
  const sx = document.querySelector(".scroll")?.scrollLeft || 0;
  $("#main").innerHTML = S.view==="check" ? checkView() : S.view==="settings" ? settingsView() : timetableView();
  const sc = document.querySelector(".scroll"); if (sc) sc.scrollLeft = sx;
  applyFit();
  renderEditor();
  writeHash();
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-tab]");
  if (tab){ S.view = tab.dataset.tab; S.other = null; render(); return; }
  if (S.admin){
    const td = e.target.closest("td[data-key]");
    if (td){
      const k = td.dataset.key; S.other = null;
      if (S.sel.length && S.sel[0].startsWith("B|")!==k.startsWith("B|")) S.sel = [];
      S.sel = S.sel.includes(k) ? S.sel.filter(x => x!==k) : [...S.sel, k];
      render(); return;
    }
    for (const [attr,kind] of [["data-dt","text"],["data-blk","blk"],["data-tut","tut"]]){
      const el = e.target.closest(`td[${attr}]`);
      if (el){ const key = el.getAttribute(attr); S.sel = []; S.other = (S.other?.kind===kind && S.other.key===key) ? null : {kind,key}; render(); return; }
    }
  }
  const dbtn = e.target.closest("[data-day]");
  if (dbtn){ S.day = +dbtn.dataset.day; render(); return; }
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const act = btn.dataset.act;
  try{
    switch(act){
      case "prev": S.week--; render(); break;
      case "next": S.week++; render(); break;
      case "today": S.week = currentWeek(); S.day = todayIdx(); render(); break;
      case "png": await exportPNG(); break;
      case "doc": await exportDocx(); break;
      case "print": S.printing = true; render(); setTimeout(() => window.print(), 50); break;
      case "csv": exportCSV(); break;
      case "backup": exportBackup(); break;
      case "apply": await applyEdit(); break;
      case "swap": await swapEdit(); break;
      case "reset": await resetEdit(); break;
      case "clearsel": clearSel(); render(); break;
      case "applytext": await applyText(false); break;
      case "resettext": await applyText(true); break;
      case "applytut": await applyTut(false); break;
      case "resettut": await applyTut(true); break;
      case "mkblk": await mkBlock(); break;
      case "applyblk": { const [date,i] = S.other.key.split("|"); const text = $("#edBlkText").value.trim(), type = selType();
        await editBlocks(date, l => { l[+i].text = text; l[+i].type = type; }); break; }
      case "delblk": { const [date,i] = S.other.key.split("|"); await editBlocks(date, l => l.splice(+i,1)); break; }
      case "resetblk": { const [date] = S.other.key.split("|"); clearSel(); await writeDay(date, {blocks:DEL}); render(); break; }
      case "addhol": {
        const div = document.createElement("div"); div.className = "holrow";
        div.innerHTML = `<input type="date" class="hd"><input type="text" class="hn" placeholder="假日名稱" style="width:150px"><button class="btn warn" data-act="delhol" type="button">刪除</button>`;
        $("#holList").appendChild(div); break; }
      case "delhol": btn.closest(".holrow").remove(); break;
      case "savesettings": {
        const hol = [...document.querySelectorAll("#holList .holrow")].map(r => ({d:r.querySelector(".hd").value, n:r.querySelector(".hn").value.trim()||"國定假日"})).filter(x => x.d);
        const obj = {termName:$("#setTerm").value.trim()||S.settings.termName, start:$("#setStart").value||S.settings.start,
                     weeks:Math.min(Math.max(+$("#setWeeks").value||20,1),30), holidays:hol};
        await writeSettings(obj); S.settings = obj; render(); $("#setMsg").textContent = "已儲存"; break; }
      case "addver": {
        const nb = structuredClone(S.bases); const last = structuredClone(nb[nb.length-1]);
        last.name = `課表版本${nb.length+1}`; last.from = weekDates(currentWeek())[0];
        nb.push(last); await writeBases(nb); render(); break; }
      case "delver": { if (!confirm("確定刪除這個課表版本？")) break; const nb = structuredClone(S.bases); nb.splice(+btn.dataset.i,1); S.baseIdx = 0; await writeBases(nb); render(); break; }
      case "savever": {
        const nb = structuredClone(S.bases);
        document.querySelectorAll("#verList .holrow").forEach((r,i) => { nb[i].name = r.querySelector(".vn").value.trim()||nb[i].name; nb[i].from = r.querySelector(".vf").value||nb[i].from; });
        nb.sort((a,b) => a.from.localeCompare(b.from)); await writeBases(nb); render(); break; }
      case "editver": S.baseIdx = +btn.dataset.i; S.editBase = true; S.view = "week"; clearSel(); render(); break;
      case "endbase": S.editBase = false; clearSel(); render(); break;
    }
  } catch(err){ console.error(err); alert("儲存失敗：" + (err.message||err)); }
});
document.addEventListener("change", e => {
  if (e.target.id==="weekSel"){ S.week = +e.target.value; render(); }
  else if (e.target.id==="clsSel"){ S.cls = +e.target.value; render(); }
  else if (e.target.id==="whoSel"){ S.who = e.target.value; try{ localStorage.setItem("tt-who", S.who); }catch(_){} render(); }
  else if (e.target.id==="monthSel"){ S.month = e.target.value; render(); }
  else if (e.target.id==="fitToggle"){ S.fit = e.target.checked; try{ localStorage.setItem("tt-fit", S.fit?"1":"0"); }catch(_){} render(); }
  else if (e.target.id==="origVer"){ S.origIdx = +e.target.value; render(); }
  else if (e.target.id==="origMode"){ S.origMode = e.target.value; render(); }
  else if (e.target.dataset.ctype){ const k = e.target.dataset.ctype; e.target.checked ? S.ctypes.add(k) : S.ctypes.delete(k); render(); }
});
$("#loginBtn").addEventListener("click", async () => {
  if (S.admin){ if (DEMO){ S.admin = false; render(); } else await fb.signOut(fb.auth); return; }
  $("#loginErr").textContent = DEMO ? "示範模式密碼：demo" : ""; $("#pw").value = ""; $("#loginDlg").showModal(); $("#pw").focus();
});
$("#loginCancel").addEventListener("click", () => $("#loginDlg").close());
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault(); const pw = $("#pw").value;
  if (DEMO){ if (pw==="demo"){ S.admin = true; $("#loginDlg").close(); render(); } else $("#loginErr").textContent = "密碼錯誤（示範模式密碼：demo）"; return; }
  try{ await fb.signIn(fb.auth, ADMIN_EMAIL, pw); $("#loginDlg").close(); }
  catch(err){ $("#loginErr").textContent = "密碼錯誤或尚未設定後台帳號"; }
});
window.addEventListener("hashchange", () => { readHash(); render(); });
window.addEventListener("afterprint", () => { if (S.printing){ S.printing = false; render(); } });
mq.addEventListener("change", () => render());
let rsT; window.addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(applyFit, 120); });
/* 縮小顯示時，滑鼠移到格子上放大顯示 */
const mag = document.createElement("div"); mag.id = "mag"; mag.hidden = true; document.body.appendChild(mag);
document.addEventListener("mousemove", e => {
  const sheet = document.querySelector(".scroll.fitmode #sheet");
  const td = e.target.closest?.(".scroll.fitmode #sheet td");
  if (!sheet || !td || +(sheet.dataset.z||1) > 0.85 || !td.innerText.trim()){ mag.hidden = true; return; }
  mag.innerHTML = td.innerHTML; mag.className = td.className.replace(/\b(edit|sel|conf|dstart)\b/g,""); mag.hidden = false;
  const x = Math.min(e.clientX + 16, innerWidth - mag.offsetWidth - 8), y = Math.min(e.clientY + 16, innerHeight - mag.offsetHeight - 8);
  mag.style.left = x + "px"; mag.style.top = y + "px";
});
function todayIdx(){ const wd = (new Date().getDay()+6)%7; return wd<=4 ? wd : 0; }

/* ---------- start ---------- */
(async () => {
  try{ S.who = localStorage.getItem("tt-who") || ""; S.fit = localStorage.getItem("tt-fit")!=="0"; }catch(_){}
  S.day = todayIdx();
  try{ await initData(); } catch(err){ console.error(err); alert("無法連線到資料庫，請稍後再試。"); }
  S.week = currentWeek();
  if (!location.hash && S.who) S.view = "teacher";   // 記住「我是誰」：直接開自己的課表
  readHash();
  render();
})();
