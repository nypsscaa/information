<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鳥嶼國小教務組</title>
<style>
:root{--bg:#f6f4ef;--paper:#fff;--ink:#1f2328;--muted:#5d6670;--soft:#e6e2d8;--accent:#1f5f8b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:40px 16px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
a.card{display:block;background:var(--paper);border:1px solid var(--soft);border-radius:12px;padding:22px 22px 20px;color:inherit;text-decoration:none;transition:border-color .15s, box-shadow .15s}
a.card:hover{border-color:#b9c9d6;box-shadow:0 4px 16px rgba(31,95,139,.10)}
.icon{width:40px;height:40px;border-radius:10px;background:#e3edf5;color:var(--accent);display:grid;place-items:center;margin-bottom:14px}
.card h2{font-size:18px;margin:0 0 6px}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.go{display:inline-block;margin-top:14px;color:var(--accent);font-size:14px;font-weight:600}
footer{margin-top:36px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>鳥嶼國小 教務組</h1>
  <p class="sub">澎湖縣白沙鄉鳥嶼國民小學</p>
  <div class="grid">
    <a class="card" href="timetable/">
      <div class="icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 4v17M13 9v12"/></svg></div>
      <h2>課表查詢</h2>
      <p>全校週課表、班級課表、個人課表；可下載圖片、Word、PDF。每週代調課即時更新。</p>
      <span class="go">進入 →</span>
    </a>
    <a class="card" href="textbook/">
      <div class="icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M19 19v2H6"/></svg></div>
      <h2>教科書選用系統</h2>
      <p>各年級領域教科書審查紀錄填寫與分配表。</p>
      <span class="go">進入 →</span>
    </a>
    <a class="card" href="curriculum/">
      <div class="icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg></div>
      <h2>校訂課程手冊</h2>
      <p>家鄉趣、數創客、閱創客、寰嶼遊、英創客五本校訂課程手冊，線上翻頁閱讀。</p>
      <span class="go">進入 →</span>
    </a>
  </div>
  <footer>教務組維護</footer>
</div>
</body>
</html>
